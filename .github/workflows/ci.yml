name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=src/infra/prisma/schema.prisma

      - name: Ruff (lint)
        run: uv run ruff check src test

      - name: Ruff (format check)
        run: uv run ruff format --check src test

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=src/infra/prisma/schema.prisma

      - name: Mypy
        run: uv run mypy src

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://test:test@localhost:3306/test
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      JWT_SECRET: ci-test-secret-at-least-32-bytes-long
      APP_ENV: test
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=src/infra/prisma/schema.prisma

      - name: Run unit tests
        run: uv run pytest -v -m "not integration" --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # O MySQL é criado pelos próprios testes via Testcontainers (Docker do runner).
    env:
      APP_ENV: test
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate Prisma client
        run: uv run prisma generate --schema=src/infra/prisma/schema.prisma

      - name: Run integration tests
        run: uv run pytest -v -m integration

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pizzaria-api:ci .

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: test-unit
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip notice
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN não configurado; análise do SonarCloud ignorada."

      - name: Download coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: -Dsonar.qualitygate.wait=true
