repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(src/infra/prisma/migrations/.*|LICENSE|\.python-version|\.github/workflows/ci\.yml|docker-compose\.yml|\.env\.example)$
      - id: end-of-file-fixer
        exclude: ^(src/infra/prisma/migrations/.*|LICENSE|\.python-version|\.github/workflows/ci\.yml|docker-compose\.yml|\.env\.example)$

      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # mypy roda pelo ambiente do projeto (uv), com o client Prisma gerado e a
  # mesma versão do CI; o mirror isolado divergia em versão e dependências.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/
